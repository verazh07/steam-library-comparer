<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
</head>
<body>
  <h1>Steam Library Comparer</h1>
  <p>Insert you and your friend's Steam Profile Links below! You must have public Steam profiles for this to work</p>
  <form action="">
    <fieldset>
      <legend>Paste Links Here</legend>
      <label for="user-1" value="e.g, https://steamcommunity.com/profiles/76561199024315847/">Steam User 1: </label> 
      <input type="text" id="user-1" name="URL" placeholder="Paste 1st User URL here" required size="20"> <br>
      
      <label for="user-2" value="e.g, https://steamcommunity.com/profiles/76561199024315847/">Steam User 2: </label>
      <input type="text" id="user-2" name=URL placeholder="Paste 2nd User URL Here" required size="20">
    </fieldset>
  </form>
</body>
</html>
